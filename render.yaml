services:
  - type: web
    name: arcus-backend
    runtime: python
    # Research serves from a prebuilt index and an ONNX embedder downloaded at
    # build time (research/fetch_assets.py), so it fits the free plan's 512 MB.
    # Scenario Lab downloads its event library and calibration the same way
    # (scenario/fetch_assets.py, SHA256-checked); it adds about 5-15 MB.
    buildCommand: pip install -r backend/requirements-research.txt && python -m research.fetch_assets && python -m scenario.fetch_assets
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: RESEARCH_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: RESEARCH_ENABLED
        value: "true"
      - key: RESEARCH_DATA_DIR
        value: research/data
      # Scenario Lab API (pair with VITE_ENABLE_SCENARIOS on the Pages build).
      - key: SCENARIO_ENABLED
        value: "true"
      - key: SCENARIO_ASSETS_DIR
        value: scenario/assets
      - key: AUTOMATION_KEY
        sync: false
      - key: RATE_LIMIT_SALT
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11"
